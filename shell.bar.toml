# Patched into the generated shell.toml as the whole [bar] section.
#
# NOTE: shell.<section>.toml REPLACES a section, it does not merge into it.
# So this file must carry every [bar] key, not just the ones being changed.
# The last four are upstream defaults, reproduced from
# $OMARCHY_PATH/default/themed/shell.toml.tpl.
#
# This file is deliberately IDENTICAL in Central Dark and Central Light.
#
# The bar is not a panel that belongs to the desktop chrome — it floats over
# the wallpaper, and the wallpaper is bright in both modes. So it keeps a dark
# scrim and white labels either way, the way a menu bar over a photo does.
# Flipping it to white-on-white in light mode is what an "invert everything"
# theme would do, and it reads much worse.

background       = "#000000"
background-alpha = 0.4
text             = "#ffffff"

# Upstream defaults.
active           = "#f7768e"
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28
